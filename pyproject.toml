[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assessment-collector"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["requests>=2.31,<3", "pywinrm>=0.5,<1", "requests-ntlm>=1.2,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
